    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google(); mavenCentral()
        // Xposed API 不在 Maven Central 主仓库里，官方仓库在这里
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "pct-bridge"
include ':app'
