name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: 回归（${{ matrix.python }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 而不是 latest：24.04 上 setup-python 取不到 3.9 的预编译包
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.13"]

    env:
      # 双保险：包内的 _force_utf8_stdio() 已经 reconfigure 过，
      # 这里再钉一次环境变量，避免别人 fork 后删掉那段就炸。
      # （windows-latest 的控制台是 cp1252，中文和 ✓ 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 回归脚本零第三方依赖：只用标准库 + 自带的 test_rules.py
      - name: 跑回归
        run: python tests/test_rules.py

      - name: 离线还原四局（冒烟，确认 CLI 能跑通）
        run: |
          python -m pct replay tests/fixtures/round_v3.jsonl
          python -m pct replay tests/fixtures/round_kan.jsonl
          python -m pct replay tests/fixtures/round_multi4.jsonl --round 4
          python -m pct replay tests/fixtures/round_draw.jsonl
        shell: bash
